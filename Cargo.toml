[workspace]
resolver = "2"
members = ["crates/desktop-core", "crates/desktop-policy", "crates/desktop-mcp", "crates/desktop-app", "vendor/aevra/helper"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

# Dependencies added on top of the helper pins. Exact versions: the plan pins
# them once and bumps are deliberate.
[workspace.dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
axum = { version = "=0.8.9", default-features = false }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
rmcp = { version = "=3.5.1", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", default-features = false }
reqwest = { version = "=0.13.4", default-features = false }
subtle = "=2.6.1"
tokio-util = { version = "=0.7.20", default-features = false }
uuid = { version = "=1.28.0", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
