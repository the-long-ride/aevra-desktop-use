[package]
name = "desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "aevra-desktop: installed-app discovery, allowlist hot reload, tray, window and cli."

[dependencies]
desktop-core = { path = "../desktop-core" }
desktop-policy = { path = "../desktop-policy" }
desktop-mcp = { path = "../desktop-mcp" }
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "net", "sync"] }
tokio-util.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# The ksni backend talks to the StatusNotifierItem D-Bus service directly, so
# Linux needs neither GTK nor libappindicator.
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
rfd = "=0.17.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# Same pin as the helper uses on macOS and Linux; added here for Windows too.
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Same version as the helper's windows pin, so one copy is built.
windows = { version = "0.58.0", features = [
  "ApplicationModel",
  "Management_Deployment",
  "Foundation_Collections",
  "Win32_System_WinRT",
  "Win32_System_Console",
] }

[[bin]]
name = "aevra-desktop"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "macros", "time"] }
